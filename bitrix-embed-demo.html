<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>APGS — Bitrix embedded demo</title>
  <style>
    body{margin:0;background:#fff;color:#333;font:14px Arial,sans-serif}.host-top{height:52px;background:#303030;color:#fff;display:flex;align-items:center;justify-content:center}.host-nav{height:78px;border-bottom:1px solid #eee;display:flex;align-items:center;gap:24px;padding:0 max(16px,calc((100% - 1240px)/2))}.host-logo{font-weight:900;font-size:20px}.host-search{height:42px;flex:1;max-width:540px;border:1px solid #ddd;border-radius:4px;padding:0 16px}.host-button{height:42px;border:0;border-radius:4px;background:#ffd20a;padding:0 22px;font-weight:700}.host-container{width:min(1240px,calc(100% - 30px));margin:30px auto 60px}.host-breadcrumbs{margin-bottom:18px;color:#969696;font-size:12px}
  </style>
</head>
<body>
  <div class="host-top">Тестовый шаблон rfzavod.com</div>
  <header class="host-nav"><div class="host-logo">CHERNOFF</div><input class="host-search" placeholder="Введите поисковый запрос"><button class="host-button">Поиск</button></header>
  <main class="host-container">
    <div class="host-breadcrumbs">Главная → Продукция → Насосы → APGS-InLine</div>
    <div id="apgs-product-card" data-mode="embedded" data-xml-id="RFZ-000001"></div>
  </main>
  <script>
    window.APGS_BITRIX_PRODUCT = {
      ID: 1001,
      XML_ID: 'RFZ-000001',
      NAME: 'APGS-InLine 50-200/5.5',
      DETAIL_PICTURE: '/pump_card/pump.png',
      PRICE: 182000,
      QUANTITY: 4,
      PROPERTIES: {
        ARTICLE: { VALUE: 'APGS-IL-50200-55' },
        PUMP_TYPE: { VALUE: 'Центробежный · InLine' },
        CONSTRUCTION: { VALUE: 'Вертикальный' },
        POWER: { VALUE: '5,5' },
        EFFICIENCY: { VALUE: '78,2' },
        DISCHARGE_DN: { VALUE: '50' },
        PN: { VALUE: '16' }
      }
    };
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
